<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Source for og-image.png, kept in the repo so the card can be
       regenerated without a design tool. Render at exactly 1200x630 (for
       example a headless browser screenshot of this page at that viewport). -->
  <title>ShoutKit social card source</title>
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #fbfbfd; }
    .card {
      box-sizing: border-box; width: 1200px; height: 630px; padding: 0 96px;
      display: flex; align-items: center; gap: 64px;
      font-family: -apple-system, "SF Pro Display", "Helvetica Neue", "Noto Sans", Arial, sans-serif;
      color: #1d1d1f;
    }
    img { width: 260px; height: 260px; border-radius: 58px; box-shadow: 0 24px 60px rgba(7, 132, 195, 0.3); flex: none; }
    .name { font-size: 34px; font-weight: 600; color: #6e6e73; margin: 0 0 10px; }
    h1 { margin: 0; font-size: 76px; line-height: 1.02; letter-spacing: -0.03em; font-weight: 700; }
    .sub {
      margin: 14px 0 0; font-size: 42px; line-height: 1.1; font-weight: 600; letter-spacing: -0.02em;
      background: linear-gradient(90deg, #0784c3, #e77274); -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .foot { margin: 26px 0 0; font-size: 24px; color: #6e6e73; }
  </style>
</head>
<body>
  <div class="card">
    <img src="assets/app-icon-256.png" alt="" />
    <div>
      <p class="name">ShoutKit</p>
      <h1>Free internet radio.</h1>
      <p class="sub">No ads, no account, no tracking.</p>
      <p class="foot">Open source · iPhone &amp; Android</p>
    </div>
  </div>
</body>
</html>
