name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full scan so newly-published queries run against unchanged code
    # (Monday 07:00 UTC). Push/PR runs only cover what a change touches.
    - cron: "0 7 * * 1"

# CodeQL needs to write analysis results back as code-scanning alerts; it reads
# the checked-out code and (for the Swift build) resolves package dependencies.
permissions:
  actions: read
  contents: read
  security-events: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    # The Swift analysis does not run on pull requests. It was, by a wide
    # margin, the most expensive thing in this repository: CodeQL's tracing
    # turns the ~4-minute Release build into a ~27-minute one, so the job billed
    # ~30 macOS larger-runner minutes *per push to every branch* — more than the
    # entire CI workflow beside it. Scanning on `main` plus the weekly cron
    # keeps the alert database current and still catches anything that lands;
    # what it gives up is per-PR alert annotations, and a repository of this
    # size does not merge fast enough for that delay to matter. The `actions`
    # analysis is unaffected — it needs no build, runs on a free ubuntu runner,
    # and stays on PRs where workflow changes are actually reviewed.
    if: matrix.language != 'swift' || github.event_name != 'pull_request'
    timeout-minutes: ${{ matrix.language == 'swift' && 45 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Swift needs a real compile, so it runs on the same Xcode 27 image as
          # CI and reuses CI's exact build invocation (see ci.yml "Build app").
          - language: swift
            runner: xcode-27
            build-mode: manual
          # Workflow/action scanning — no build. This replaces the `actions`
          # coverage that GitHub's default CodeQL setup provided; default setup
          # must be turned OFF for this advanced workflow to run at all (the two
          # can't coexist — see the repo's Code security settings).
          - language: actions
            runner: ubuntu-latest
            build-mode: none
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # This job used to cold-resolve the whole workspace graph every run —
      # including the AudioStreaming ogg/vorbis xcframework download that
      # ci.yml's `build` job caches — on the most expensive runner in the repo.
      # Same key space as ci.yml so the two warm each other's store rather than
      # each paying its own resolve.
      - name: Cache SwiftPM clones and binary artifacts
        if: matrix.language == 'swift'
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            DerivedData/SourcePackages
          key: spm-app-codeql-${{ hashFiles('ShoutKit.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-app-codeql-

      # Mirrors ci.yml: select the newest Xcode and build the app for the iOS
      # Simulator so CodeQL can trace the Swift compilation. Keep the xcodebuild
      # flags in sync with the CI build job.
      - name: Build app (Swift)
        if: matrix.language == 'swift'
        run: |
          set -o pipefail
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -workspace ShoutKit.xcworkspace -scheme ShoutKit \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            GIT_COMMIT_SHA="$(git rev-parse --short HEAD)" build 2>&1 | tee build-release.log

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.6
        with:
          category: "/language:${{ matrix.language }}"
