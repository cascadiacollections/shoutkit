name: Deploy site and API docs

# Publishes the static marketing site in `site/` plus the generated DocC
# reference for the MIT-licensed packages (the Holmdel SDK surface) to GitHub
# Pages. The marketing site is plain HTML with no build step; the API docs are
# built fresh on every run by `.github/scripts/build-docs.sh` and never
# committed.
on:
  push:
    branches: [main]
    # Kept in sync with the `pull_request` list below by hand — GitHub Actions
    # does not support YAML anchors.
    paths:
      - "site/**"
      - "Packages/AudioLevels/**"
      - "Packages/DesignSystem/**"
      - "Packages/FeatureFlags/**"
      - "Packages/ImageIODownsample/**"
      - "Packages/Persistence/**"
      - "Packages/Playback/**"
      - "Packages/PlaybackEngineAudioStreaming/**"
      - "Packages/RadioDirectory/**"
      - ".github/scripts/build-docs.sh"
      - ".github/workflows/pages.yml"
  # Build-only validation before merge. `pages.yml` used to run on `main`
  # exclusively, so a PR that broke `docbuild` — a renamed scheme, an
  # unresolvable symbol link, a package added to the loop but not to the
  # workspace — was only discovered after merge, on the branch that deploys.
  pull_request:
    paths:
      - "site/**"
      - "Packages/AudioLevels/**"
      - "Packages/DesignSystem/**"
      - "Packages/FeatureFlags/**"
      - "Packages/ImageIODownsample/**"
      - "Packages/Persistence/**"
      - "Packages/Playback/**"
      - "Packages/PlaybackEngineAudioStreaming/**"
      - "Packages/RadioDirectory/**"
      - ".github/scripts/build-docs.sh"
      - ".github/workflows/pages.yml"
  # Allow manual runs from the Actions tab (e.g. first deploy).
  workflow_dispatch:

# Least privilege: read-only by default. Only the deploy job mints the OIDC
# token the deploy step needs and writes to the Pages environment.
permissions:
  contents: read

# Only one Pages deploy at a time; don't cancel an in-flight publish. PR
# validation is keyed by ref so pushes to a branch supersede each other.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PRs prove the docs still build; they never deploy, and they declare no
  # `environment:`, so a fork PR can't reach the Pages environment.
  validate:
    name: Build API docs (validation)
    if: github.event_name == 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"

      - name: Build documentation
        run: .github/scripts/build-docs.sh

  build:
    name: Build API docs and upload Pages artifact
    if: github.event_name != 'pull_request'
    # DocC generation goes through `xcodebuild docbuild`, so this needs the
    # same pinned Xcode as the rest of CI (see ci.yml's cost comment on this
    # label). The site is not passed to the deploy job as individual files.
    # `actions/upload-artifact` rejects filenames containing `:`, and DocC's
    # JSON output encodes Swift parameter labels straight into filenames
    # (`start(url:streamGeneration:).json`). `upload-pages-artifact` tars the
    # whole site into one archive, so those names never become artifact entries.
    permissions:
      contents: read
      pages: write
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"

      - name: Build documentation
        run: .github/scripts/build-docs.sh

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # Deploy is its own job. `actions/deploy-pages` lists artifacts the instant
  # it starts, and in the uploading job that list is often empty for an
  # artifact finalized a fraction of a second earlier
  # (actions/deploy-pages#451). From 2026-11-23 that race failed every
  # publish on main. A later job lists the archive after the upload job has
  # finished. The retry covers a longer listing lag: on the morning of
  # 2026-11-24 a two-second gap between jobs was no longer enough. The retry
  # runs only when the first attempt never created a deployment. Re-running
  # the old same-job deploy cannot recover: it uploads a second
  # `github-pages` artifact and the next lookup fails with "multiple
  # artifacts".
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && needs.build.result == 'success'
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Wait for the Pages artifact listing
        if: steps.deployment.outcome == 'failure' && steps.deployment.outputs.page_url == ''
        run: sleep 20

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure' && steps.deployment.outputs.page_url == ''
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Require a successful Pages deploy
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome != 'success'
        run: exit 1
