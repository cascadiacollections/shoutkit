name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the checked-out code. No job here
# writes to the repo, comments, or publishes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin SwiftLint so `--strict` is deterministic — an upstream release adding a
  # new rule can't fail CI without a deliberate bump here. Keep in sync with the
  # version contributors run locally (see CONTRIBUTING).
  SWIFTLINT_VERSION: "0.65.0"

jobs:
  host-tests:
    name: Package tests (macOS host)
    # Needs Xcode 26 / Swift 6.2. Pin a newer image if this one lags.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          swift --version

      - name: RadioDirectory tests
        working-directory: Packages/RadioDirectory
        run: swift test

      - name: Playback tests
        working-directory: Packages/Playback
        run: swift test

      - name: Persistence tests
        working-directory: Packages/Persistence
        run: swift test

      - name: ImageIODownsample tests
        working-directory: Packages/ImageIODownsample
        run: swift test

  build:
    name: Build app + compile Playback tests (iOS Simulator)
    runs-on: macos-26
    # Debug + Release builds share one DerivedData root (package resolution
    # and unchanged modules are reused across the pair), but building the app
    # twice still roughly doubles this job's time versus the single-config
    # baseline.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      # Also compiles the UIKit-gated production types (AudioStreamingPlaybackEngine,
      # NowPlayingCenter) that the host test job never sees. GIT_COMMIT_SHA is
      # stamped into the app's Info.plist (surfaced in Settings → About) so a
      # distributed build maps back to an exact source revision; archive/release
      # builds must pass it the same way.
      - name: Build app
        run: |
          set -o pipefail
          xcodebuild -workspace ShoutKit.xcworkspace -scheme ShoutKit \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            GIT_COMMIT_SHA="$(git rev-parse --short HEAD)" build 2>&1 | tee build.log

      # Surface compiler errors as check annotations. Raw job logs live on
      # Azure blob storage, which repo-scoped tokens (and remote agents
      # working a PR) can't always reach — annotations are readable via the
      # Checks API, so a build failure stays diagnosable from the API alone.
      - name: Emit compile errors as annotations
        if: failure()
        run: |
          grep -E "(error|fatal error): " build.log | sort -u | head -10 | sed 's/^/::error::/' || true

      # Pulse (kean/Pulse) is declared only by the app-side DebugSupport package
      # and gated behind #if DEBUG end to end (see
      # DebugSupport/DebugNetworkInspection.swift), so it must link into Debug
      # and never into Release. Static linking + dead-code stripping means an
      # entirely #if DEBUG-gated dependency simply doesn't get pulled into a
      # Release binary — verify both sides of that contract by symbol-checking
      # each configuration's build product directly, rather than trusting it.
      - name: Verify Pulse symbols are present in the Debug build
        run: |
          APP_BINARY="DerivedData/Build/Products/Debug-iphonesimulator/ShoutKit.app/ShoutKit"
          if [ ! -f "$APP_BINARY" ]; then
            echo "::error::Debug app binary not found at $APP_BINARY"
            exit 1
          fi
          if ! nm "$APP_BINARY" 2>/dev/null | grep -q "NetworkLogger"; then
            echo "::error::Expected Pulse (NetworkLogger) symbols in the Debug binary but found none"
            exit 1
          fi
          echo "Confirmed: Pulse symbols are present in the Debug binary."

      - name: Build app (Release)
        run: |
          set -o pipefail
          xcodebuild -workspace ShoutKit.xcworkspace -scheme ShoutKit \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            GIT_COMMIT_SHA="$(git rev-parse --short HEAD)" build 2>&1 | tee build-release.log

      - name: Emit Release compile errors as annotations
        if: failure()
        run: |
          grep -E "(error|fatal error): " build-release.log | sort -u | head -10 | sed 's/^/::error::/' || true

      - name: Report Pulse symbol status in the Release build
        run: |
          APP_BINARY="DerivedData/Build/Products/Release-iphonesimulator/ShoutKit.app/ShoutKit"
          if [ ! -f "$APP_BINARY" ]; then
            echo "::error::Release app binary not found at $APP_BINARY"
            exit 1
          fi
          if nm "$APP_BINARY" 2>/dev/null | grep -q "NetworkLogger"; then
            echo "Pulse's compiled module is present (unused) in the Release binary — expected, see the comment above."
          else
            echo "Pulse symbols are absent from the Release binary."
          fi

  # Regression guard: verify that no Package.swift or the Xcode project has had
  # its iOS deployment target raised above the documented minimums. This catches
  # accidental bumps (e.g. auto-generated Xcode stubs defaulting to a newer OS).
  #
  # Expected minimums (update this table when a package is intentionally lowered):
  #   RadioDirectory, ImageIODownsample, DebugSupport  → iOS 16.0
  #   Playback, Persistence                            → iOS 17.0  (@Observable / SwiftData)
  #   LiveActivity                                     → iOS 16.0  (16.1 APIs guarded with @available)
  #   DesignSystem, feature packages                   → iOS 17.0  (depend on Playback/Persistence)
  #   Xcode app target                                 → iOS 16.0  (stated minimum)
  validate-deployment-targets:
    name: Validate deployment targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check Xcode project target (must be 16.0)
        run: |
          FOUND=$(grep -o 'IPHONEOS_DEPLOYMENT_TARGET = [^;]*' \
            ShoutKitApp/ShoutKitApp.xcodeproj/project.pbxproj | sort -u)
          EXPECTED="IPHONEOS_DEPLOYMENT_TARGET = 16.0"
          if [ "$FOUND" != "$EXPECTED" ]; then
            echo "::error::Expected deployment target '$EXPECTED' but found: $FOUND"
            exit 1
          fi
          echo "OK: $FOUND"

      - name: Check iOS-16 packages (.v16 floor)
        run: |
          FAIL=0
          for pkg in \
            Packages/RadioDirectory/Package.swift \
            Packages/ImageIODownsample/Package.swift \
            Packages/DebugSupport/Package.swift; do
            if ! grep -q '\.iOS(\.v16)' "$pkg"; then
              echo "::error::$pkg must declare .iOS(.v16)"
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] && echo "OK: iOS-16 packages verified."
          exit $FAIL

      - name: Check iOS-16 packages (LiveActivity package floor)
        run: |
          if ! grep -q '\.iOS(\.v16)' Packages/LiveActivity/Package.swift; then
            echo "::error::Packages/LiveActivity/Package.swift must declare .iOS(.v16)"
            exit 1
          fi
          echo "OK: LiveActivity iOS-16 package floor verified."

      - name: Check iOS-17 packages (.v17 floor)
        run: |
          FAIL=0
          for pkg in \
            Packages/Persistence/Package.swift \
            Packages/Playback/Package.swift \
            Packages/DesignSystem/Package.swift \
            Packages/Features/BrowseFeature/Package.swift \
            Packages/Features/SearchFeature/Package.swift \
            Packages/Features/PlayerFeature/Package.swift \
            Packages/Features/LibraryFeature/Package.swift \
            Packages/Features/SettingsFeature/Package.swift; do
            if ! grep -q '\.iOS(\.v17)' "$pkg"; then
              echo "::error::$pkg must declare .iOS(.v17)"
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] && echo "OK: iOS-17 packages verified."
          exit $FAIL

  lint:
    name: Lint & format
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Download the pinned portable binary rather than `brew install` (faster,
      # version-pinned, and no Homebrew tap-trust noise in the log).
      - name: Install SwiftLint ${{ env.SWIFTLINT_VERSION }}
        run: |
          curl -fsSL -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -q swiftlint.zip -d swiftlint-bin
          echo "$PWD/swiftlint-bin" >> "$GITHUB_PATH"

      # --strict promotes warnings to errors: the tree is lint-clean today, and
      # this keeps it that way (new warnings fail the build instead of rotting).
      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging

      # Homebrew ships current SwiftFormat and is preinstalled on GitHub-hosted
      # macOS runners; --lint fails instead of rewriting, so drift from the
      # checked-in `.swiftformat` config shows up as a CI failure.
      - name: Install SwiftFormat
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install swiftformat

      # continue-on-error: the tree has never had swiftformat enforced (58/90
      # files fail --lint today, mostly indent/brace-wrap rules), and fixing
      # that needs a byte-exact `swiftformat` run from a real toolchain, which
      # isn't available in every contributor's environment. Surfaces drift
      # without blocking merges until a one-time reformat lands (see
      # DECISIONS.md); drop continue-on-error once the tree is clean.
      - name: Format check
        continue-on-error: true
        run: swiftformat ShoutKitApp Packages --lint
