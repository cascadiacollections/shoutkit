name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `ready_for_review` is not in the default type set, and the draft gates on
    # the mac jobs below make it load-bearing: without it, marking a draft ready
    # fires no event and the jobs a draft skipped would never run at all.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Least privilege: CI only needs to read the checked-out code. No job here
# writes to the repo, comments, or publishes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin SwiftLint so `--strict` is deterministic — an upstream release adding a
  # new rule can't fail CI without a deliberate bump here. Keep in sync with the
  # version contributors run locally (see CONTRIBUTING).
  SWIFTLINT_VERSION: "0.65.0"

# Every job below that says `runs-on: xcode-27` is billed. This repo is public,
# so GitHub's *standard* hosted runners — including `macos-26` — are free, but
# `xcode-27` is a larger-runner label and larger runners are billed on public
# repos too. That one label is essentially the entire Actions bill, which is why
# the job graph here is shaped around minimising time on it rather than around
# convenience. Three rules, in order of how much they save:
#
#   1. Nothing expensive starts until `lint` passes. Lint is ~15s of work and
#      catches a real share of failures; before this gate a lint-only failure
#      still burned the full ~19 mac-minutes of the two jobs beside it. Run
#      31275068736 is the worked example: lint went red 7 seconds in and `build`
#      carried on for another 14 minutes on a tree that could not merge.
#   2. Draft PRs get the cheap signal, not the expensive one. `host-tests`
#      (~4 min) covers eight packages and runs on drafts; the simulator job
#      (~15 min) waits for `ready_for_review`. Agent-authored branches push many
#      times per PR, and that is where the minutes were going.
#   3. Compile-only checks that rarely fail independently of the Debug build —
#      Release config and the watch app — run on `main` rather than per push.
#      See the `release-checks` job for the trade-off that buys.
#
# The standing lever nobody should forget: when Xcode 27 reaches the free
# `macos-26` image, flipping `runs-on` takes this bill to approximately zero.
# That is what .github/workflows/runner-image-watch.yml exists to notice.
jobs:
  # Pure shell over the package manifests, so it runs on Linux rather than
  # burning an `xcode-27` slot. Asserts the Licensing rule in README.md: an MIT
  # package may not depend on a GPL-3.0 one. This is a real regression guard —
  # `Playback` and `DesignSystem` both linked the then-GPL `ImageIODownsample`
  # while the docs site listed it as excluded-because-GPL.
  license-boundary:
    name: License boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check MIT packages take no GPL-3.0 dependencies
        run: .github/scripts/check-license-boundary.sh

  # Deliberately ungated and first: it is by far the cheapest job here, and both
  # mac jobs below `needs` it.
  lint:
    name: Lint & format
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Download the pinned portable binary rather than `brew install` (faster,
      # version-pinned, and no Homebrew tap-trust noise in the log).
      - name: Install SwiftLint ${{ env.SWIFTLINT_VERSION }}
        run: |
          curl -fsSL -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -q swiftlint.zip -d swiftlint-bin
          echo "$PWD/swiftlint-bin" >> "$GITHUB_PATH"

      # --strict promotes warnings to errors: the tree is lint-clean today, and
      # this keeps it that way (new warnings fail the build instead of rotting).
      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging

      # Homebrew ships current SwiftFormat and is preinstalled on GitHub-hosted
      # macOS runners; --lint fails instead of rewriting, so drift from the
      # checked-in `.swiftformat` config shows up as a CI failure.
      - name: Install SwiftFormat
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install swiftformat

      # continue-on-error: the tree has never had swiftformat enforced (58/90
      # files fail --lint today, mostly indent/brace-wrap rules), and fixing
      # that needs a byte-exact `swiftformat` run from a real toolchain, which
      # isn't available in every contributor's environment. Surfaces drift
      # without blocking merges until a one-time reformat lands (see
      # DECISIONS.md); drop continue-on-error once the tree is clean.
      - name: Format check
        continue-on-error: true
        run: swiftformat ShoutKitApp Packages --lint

  host-tests:
    name: Package tests (macOS host)
    # Needs Xcode 27 / Swift 6.4 because the manifests are
    # swift-tools-version 6.4 and the MediaSession now-playing path needs the
    # iOS 27 SDK to compile. This is a *toolchain* requirement and not the
    # deployment floor, which is iOS 26 — lowering the floor did not lower what
    # CI has to build with (see DECISIONS.md 2026-07-13 and 2026-08-12).
    # `xcode-27` is GitHub's dedicated Xcode 27 beta image (arm64, macOS 26
    # base); switch back to plain `macos-26` once Xcode 27 GA lands there.
    runs-on: xcode-27
    needs: lint
    # Runs on drafts, unlike `build`: at ~4 minutes this is the cheap signal,
    # and it is the only job covering the eight host-testable packages.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Select latest Xcode
        id: toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          swift --version
          # Folded into the SwiftPM cache key below: `xcode-27` is a rotating
          # beta image, and SwiftPM's manifest-compile cache is toolchain
          # specific. Artifacts and clones aren't, but keying the whole store on
          # the toolchain is cheaper than reasoning about which parts survive an
          # image bump.
          echo "id=$(swift --version 2>&1 | shasum -a 256 | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # This job resolves seven package graphs, and caching the store they all
      # share cuts that to one cold resolve per toolchain/lockfile pair.
      #
      # The AudioStreaming/ogg/vorbis download this comment used to describe is
      # gone from this job: the engine moved to Packages/PlaybackEngineAudioStreaming,
      # which is iOS-only and linked by the app target alone, so no package
      # resolved here declares AudioStreaming at all (#122). The guard step after
      # the Playback tests is what keeps it that way. The `build` job still pays
      # the download, and its cache comment still carries the availability
      # rationale — see DECISIONS.md 2026-08-05.
      - name: Cache SwiftPM clones and binary artifacts
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          # `**`, not `*`: four lockfiles live a level down under
          # Packages/Features/, and a glob that misses them would hand this job
          # an exact-key hit against a store that no longer matches the graph.
          # Deliberately a superset of what the seven test steps below resolve —
          # over-invalidating costs one extra cache save, since restore-keys
          # still lands a warm store, whereas under-invalidating costs a stale
          # hit. Asymmetric, so err wide.
          key: spm-host-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Packages/**/Package.resolved') }}
          # Prefix fallback: a resolved-file change should still reuse the
          # unchanged majority of the store rather than re-fetching everything.
          restore-keys: |
            spm-host-${{ steps.toolchain.outputs.id }}-

      # --disable-xctest: every package test suite is Swift Testing (no
      # `import XCTest` anywhere), but `swift test` still runs a legacy XCTest
      # pass over each bundle — and Xcode 27 beta 3's xctest agent segfaults
      # (SIGSEGV in type-metadata completion) doing that on the macOS 26
      # runner. The Swift Testing pass runs all the real tests either way.
      # Drop the flag once a stable Xcode 27 lands on the runner image.
      - name: RadioDirectory tests
        working-directory: Packages/RadioDirectory
        run: swift test --disable-xctest --enable-code-coverage

      - name: Playback tests
        working-directory: Packages/Playback
        run: swift test --disable-xctest --enable-code-coverage

      # Regression guard for #122. Before the engine moved out, resolving
      # Packages/Playback downloaded the ogg and vorbis xcframeworks — SwiftPM
      # enumerates binary artifacts with no platform filtering, so the
      # `.when(platforms: [.iOS])` condition on the target dependency stopped
      # them being linked but never being fetched. Re-declaring AudioStreaming
      # anywhere in this package's graph would silently bring ~5.6 MB of codec
      # zips back into a suite that links neither, and nothing else here would
      # notice. Checks the workspace artifact tree rather than the shared store,
      # which is restored from cache and can legitimately hold artifacts a
      # different job downloaded.
      - name: Assert Playback resolves no binary artifacts
        run: |
          set -uo pipefail
          ARTIFACTS="Packages/Playback/.build/artifacts"
          if [ ! -d "$ARTIFACTS" ]; then
            echo "No artifact directory under Packages/Playback/.build — nothing was downloaded."
            exit 0
          fi
          FOUND="$(find "$ARTIFACTS" -maxdepth 2 -mindepth 1 || true)"
          if [ -n "$FOUND" ]; then
            echo "::error::Packages/Playback resolved binary artifacts again — see issue #122."
            echo "$FOUND"
            exit 1
          fi
          echo "Artifact directory exists but is empty."

      - name: Persistence tests
        working-directory: Packages/Persistence
        run: swift test --disable-xctest --enable-code-coverage

      - name: ImageIODownsample tests
        working-directory: Packages/ImageIODownsample
        run: swift test --disable-xctest --enable-code-coverage

      - name: FeatureFlags tests
        working-directory: Packages/FeatureFlags
        run: swift test --disable-xctest --enable-code-coverage

      # BrowseFeatureCore/SearchFeatureCore hold the Browse/Search view-model
      # logic split out of BrowseFeature/SearchFeature specifically so it can
      # run here: those two feature packages depend on DesignSystem, whose
      # UIKit-only sources don't build for the mac host at all.
      - name: BrowseFeatureCore tests
        working-directory: Packages/BrowseFeatureCore
        run: swift test --disable-xctest --enable-code-coverage

      - name: SearchFeatureCore tests
        working-directory: Packages/SearchFeatureCore
        run: swift test --disable-xctest --enable-code-coverage

      - name: PlayerFeatureCore tests
        working-directory: Packages/PlayerFeatureCore
        run: swift test --disable-xctest --enable-code-coverage

      # Baseline only — deliberately no threshold, no gate, and no third-party
      # uploader. The tree has never measured coverage, and a gate imposed on
      # an unmeasured tree buys tests for whatever is easiest to cover rather
      # than whatever matters. Publish the number first; decide what to do
      # about it once there's a trend to read (docs/ROADMAP.md).
      #
      # `if: always()` so a failing suite still reports what it did cover —
      # that's exactly when the number is interesting.
      #
      # Reads the llvm-cov JSON that SwiftPM exports next to the profdata,
      # located by `find` rather than by path: the codecov directory sits under
      # a build-triple segment (`.build/arm64-apple-macosx/debug/codecov/`) that
      # differs between this runner and a contributor's machine, and
      # `--show-codecov-path` would mean invoking swift an eighth through
      # fourteenth time just to print it.
      - name: Coverage baseline
        if: always()
        run: |
          set -uo pipefail
          python3 .github/scripts/coverage_summary.py \
            Packages/RadioDirectory Packages/Playback Packages/Persistence \
            Packages/ImageIODownsample Packages/FeatureFlags \
            Packages/BrowseFeatureCore Packages/SearchFeatureCore \
            Packages/PlayerFeatureCore \
            | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: Test app (iOS Simulator)
    runs-on: xcode-27
    needs: lint
    # Skipped on draft PRs — the expensive half of rule 2 in the header comment.
    # `github.event.pull_request.draft` is null on a push, hence the explicit
    # event check rather than a bare negation.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Was 75 when this job also built Release and the watch app. The Debug test
    # run alone is ~8-9 minutes observed, so 30 is generous headroom while
    # capping what a wedged simulator can cost: a hung job bills its full
    # timeout, and 75 billed minutes is a real amount of money to lose to a
    # runner that stopped making progress.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select latest Xcode
        id: toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version
          echo "id=$(xcodebuild -version | shasum -a 256 | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # Same rationale as the host-tests cache above. Two paths, because Xcode
      # splits the work: the shared store under ~/Library/Caches holds the
      # downloaded artifacts, while `-derivedDataPath DerivedData` puts the
      # per-workspace checkouts and resolved artifact tree under
      # DerivedData/SourcePackages. Restoring both is what makes the Debug and
      # Release builds start from a fully warm package graph.
      #
      # Scoped to SourcePackages rather than all of DerivedData deliberately:
      # caching build products across runs would undermine the Pulse symbol
      # checks below, which need to reflect this commit's actual link result.
      - name: Cache SwiftPM clones and binary artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            DerivedData/SourcePackages
          key: spm-app-${{ steps.toolchain.outputs.id }}-${{ hashFiles('ShoutKit.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-app-${{ steps.toolchain.outputs.id }}-

      # Resolved by UDID at runtime rather than pinned by device name: the
      # Xcode beta runner images rotate which iPhone models and iOS runtimes
      # ship, and a stale `name=iPhone NN` destination fails the whole job with
      # an unhelpful "unable to find a device" error.
      - name: Select an iOS Simulator
        id: simulator
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys

          def version(runtime_identifier):
              # ...SimRuntime.iOS-27-1 -> (27, 1). Compared as numbers, not as
              # text: lexicographically "iOS-9-0" sorts above "iOS-27-0", and
              # "iOS-27-10" below "iOS-27-2".
              return tuple(int(part) for part in re.findall(r"\d+", runtime_identifier.rsplit(".", 1)[-1]))

          runtimes = json.load(sys.stdin)["devices"]
          candidates = [
              (version(runtime), device["name"], device["udid"])
              for runtime, devices in runtimes.items()
              if "iOS" in runtime
              for device in devices
              if device.get("isAvailable") and "iPhone" in device["name"]
          ]
          # Device name is the tiebreak so a runner with several iPhones on the
          # newest runtime still resolves to the same one every run.
          candidates.sort(key=lambda candidate: candidate[:2])
          print(candidates[-1][2] if candidates else "")
          ')"
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone simulator on the runner image"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # `test`, not `build`: this is the only job that runs ShoutKitTests and
      # the iOS-only package suites (DesignSystemTests,
      # NowPlayingActivityCoreTests) — none of them can run on the macOS host,
      # so before this they were maintained but never executed. It also still
      # compiles the UIKit-gated production types (AudioStreamingPlaybackEngine,
      # NowPlayingCenter) the host test job never sees. GIT_COMMIT_SHA is
      # stamped into the app's Info.plist (surfaced in Settings → About) so a
      # distributed build maps back to an exact source revision; archive/release
      # builds must pass it the same way.
      - name: Test app (Debug)
        run: |
          set -o pipefail
          xcodebuild -workspace ShoutKit.xcworkspace -scheme ShoutKit \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            GIT_COMMIT_SHA="$(git rev-parse --short HEAD)" test 2>&1 | tee build.log

      # Surface compiler errors and test failures as check annotations. Raw job
      # logs live on Azure blob storage, which repo-scoped tokens (and remote
      # agents working a PR) can't always reach — annotations are readable via
      # the Checks API, so a failure stays diagnosable from the API alone.
      # Ordered by signal, because the budget is small and the app under test
      # writes a *lot* of OS-log noise to this same stream. Notably a broad
      # `error: ` match is useless here: the simulator emits pages of
      # `[error] CoreData: error: …` during app launch that crowd out the real
      # failure, so compiler errors are matched on the `file.swift:LINE:COL:`
      # shape instead. Test patterns cover both frameworks — `recorded an
      # issue` / `Expectation failed` from Swift Testing (what every suite here
      # uses), `Test Case '…' failed` / `XCTAssert…` from XCTest — plus
      # `Fatal error:` for a runtime trap, which crashes the test process and
      # otherwise leaves no assertion line at all.
      - name: Emit compile errors and test failures as annotations
        if: failure()
        run: |
          {
            grep -E "Fatal error: |recorded an issue|Expectation failed|Test Case .* failed|XCTAssert|Test run .* failed|\*\* (TEST|BUILD) FAILED \*\*" build.log || true
            # xcodebuild's end-of-run roster, which names the failing tests and
            # matches none of the patterns above.
            sed -n "/^Failing tests:/,/^$/p" build.log || true
            grep -E "[^ /]+\.(swift|h|m|mm):[0-9]+:[0-9]+: (error|fatal error): |^error: " build.log || true
          } | sed '/^[[:space:]]*$/d' | sort -u | head -30 | sed 's/^/::error::/'

      # Pulse (kean/Pulse) is declared only by the app-side DebugSupport package
      # and gated behind #if DEBUG end to end (see
      # DebugSupport/DebugNetworkInspection.swift), so it must link into Debug
      # and never into Release. Static linking + dead-code stripping means an
      # entirely #if DEBUG-gated dependency simply doesn't get pulled into a
      # Release binary — verify both sides of that contract by symbol-checking
      # each configuration's build product directly, rather than trusting it.
      # The counterpart to the host job's coverage baseline, and the only place
      # the iOS-only code can be measured at all: DesignSystem,
      # NowPlayingActivityCore and the app target never run on the mac host.
      # Baseline only, same as there — reported, never gated. Enabled by
      # `codeCoverage` in ShoutKit.xctestplan rather than a flag here, so a
      # local Cmd+U run produces the same data.
      - name: Coverage baseline (iOS targets)
        if: always()
        run: |
          set -uo pipefail
          if [ ! -d TestResults.xcresult ]; then
            echo "No result bundle — the test step did not get far enough to produce one."
            exit 0
          fi
          # A baseline reporter must never be the reason a run is red. When the
          # test step fails, the bundle exists but holds no coverage report and
          # `xccov` exits non-zero — reporting that as a second failure buries
          # the real one, which is what it did the first time this ran.
          if ! xcrun xccov view --report --json TestResults.xcresult > coverage.json 2> coverage.err; then
            echo "No coverage report in the result bundle — the test run did not complete:"
            cat coverage.err
            exit 0
          fi
          # tee rather than plain redirect: a step summary is not readable from
          # the Checks API, and this job's failures are often diagnosed from the
          # API alone (same reason the annotation steps above exist). An empty
          # profdata still "succeeds", so the numbers need to be somewhere a
          # human or an agent can actually read them.
          python3 .github/scripts/xccov_summary.py < coverage.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify Pulse symbols are present in the Debug build
        run: |
          APP_BINARY="DerivedData/Build/Products/Debug-iphonesimulator/ShoutKit.app/ShoutKit"
          if [ ! -f "$APP_BINARY" ]; then
            echo "::error::Debug app binary not found at $APP_BINARY"
            exit 1
          fi
          if ! nm "$APP_BINARY" 2>/dev/null | grep -q "NetworkLogger"; then
            echo "::error::Expected Pulse (NetworkLogger) symbols in the Debug binary but found none"
            exit 1
          fi
          echo "Confirmed: Pulse symbols are present in the Debug binary."

      # Hard check, and it was a warning until 2026-08-12 because until then it
      # was failing: there was no Embed Watch Content copy phase, so the watchOS
      # companion that README advertises never installed alongside the phone app.
      # The embed now exists; this asserts it stays. Nothing else in CI would
      # notice its removal — the watch target compiles from its own scheme in
      # `release-checks` whether or not anything embeds the product.
      #
      # Inspects the built bundle rather than grepping project.pbxproj on
      # purpose: the copy phase can be present and still produce no payload (a
      # wrong dstPath puts it somewhere the installer ignores), and the original
      # bug was found precisely because a claim read off the project file was
      # checked against a real build.
      #
      # Lives here rather than beside the watch build in `release-checks`: it
      # inspects the *phone* app's Debug bundle, which is this job's product.
      - name: Check the watch app is embedded in the phone app
        run: |
          APP="DerivedData/Build/Products/Debug-iphonesimulator/ShoutKit.app"
          if [ ! -d "$APP" ]; then
            echo "::error::No Debug app bundle at $APP to inspect."
            exit 1
          fi
          WATCH_APP="$APP/Watch/ShoutKitWatchApp.app"
          if [ ! -d "$WATCH_APP" ]; then
            echo "::error::No Watch/ShoutKitWatchApp.app payload in ShoutKit.app — the watchOS companion is not embedded in the phone app. Check the Embed Watch Content copy phase on the ShoutKit target."
            exit 1
          fi
          # The companion key is what makes the payload installable rather than
          # merely present; a standalone watch app copied into Watch/ is the
          # shape this bug originally had.
          COMPANION=$(/usr/libexec/PlistBuddy -c "Print :WKCompanionAppBundleIdentifier" "$WATCH_APP/Info.plist" 2>/dev/null || true)
          if [ "$COMPANION" != "com.cascadiacollections.shoutkit" ]; then
            echo "::error::Embedded watch app's WKCompanionAppBundleIdentifier is '${COMPANION:-<missing>}', expected com.cascadiacollections.shoutkit."
            exit 1
          fi
          echo "Confirmed: watch companion embedded at Watch/ShoutKitWatchApp.app, companion id $COMPANION."

  # Release-configuration and watchOS compiles, split out of `build` and off the
  # per-push path. Both are compile-only — neither runs a test — and together
  # they were ~5.5 of that job's ~14 minutes, on every push to every branch.
  #
  # The trade-off, stated plainly because it is a real one: a change that builds
  # in Debug for iOS but breaks Release or watchOS now goes red on `main` rather
  # than on the PR that introduced it. That is a worse place to find out. It is
  # accepted here because the failure mode is narrow (Release-only breakage is
  # almost always `#if DEBUG` drift; watch breakage is almost always a shared
  # package API change), because it always surfaces as a compile error rather
  # than as something subtle, and because it is cheap to fix forward — whereas
  # the cost of checking it on every push was not. `workflow_dispatch` is the
  # escape hatch for a PR that expects to touch either.
  release-checks:
    name: Build app (Release, watchOS)
    runs-on: xcode-27
    needs: lint
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select latest Xcode
        id: toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version
          echo "id=$(xcodebuild -version | shasum -a 256 | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # Shares the `spm-app-` key space with the `build` job deliberately: same
      # workspace, same Package.resolved, same toolchain, so whichever of the two
      # runs first on a given commit warms the store for the other instead of
      # each paying its own cold resolve.
      - name: Cache SwiftPM clones and binary artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            DerivedData/SourcePackages
          key: spm-app-${{ steps.toolchain.outputs.id }}-${{ hashFiles('ShoutKit.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-app-${{ steps.toolchain.outputs.id }}-

      - name: Build app (Release)
        run: |
          set -o pipefail
          xcodebuild -workspace ShoutKit.xcworkspace -scheme ShoutKit \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            GIT_COMMIT_SHA="$(git rev-parse --short HEAD)" build 2>&1 | tee build-release.log

      - name: Emit Release compile errors as annotations
        if: failure()
        run: |
          grep -E "(error|fatal error): " build-release.log | sort -u | head -10 | sed 's/^/::error::/' || true

      # The watch app is a separate top-level target, not an extension embedded
      # in ShoutKit: it is absent from ShoutKit's `dependencies` and from its
      # Embed Foundation Extensions phase (which carries ShoutKitWidgets.appex
      # and nothing else). So the ShoutKit scheme never compiles it, and until
      # this step the watch app and its complication — ~670 lines across
      # ShoutKitWatchApp and ShoutKitWatchWidgets — could break without any
      # check going red. Built via its own shared scheme, added alongside this.
      #
      # `generic/platform=watchOS Simulator`: this is a compile check, not a
      # test run, so it needs no booted device and no runtime lookup.
      - name: Build watch app (Debug)
        run: |
          set -o pipefail
          xcodebuild -workspace ShoutKit.xcworkspace -scheme ShoutKitWatchApp \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build-watch.log

      # Guarded on the log existing: an earlier step failing means this one runs
      # against a file the watch build never got as far as writing, and `grep:
      # No such file` in the log of a failed run is one more thing to read past.
      - name: Emit watch compile errors as annotations
        if: failure()
        run: |
          [ -f build-watch.log ] || exit 0
          grep -E "[^ /]+\.(swift|h|m|mm):[0-9]+:[0-9]+: (error|fatal error): |^error: " build-watch.log \
            | sort -u | head -20 | sed 's/^/::error::/' || true

      # Same reasoning as the watch step above, and the same blind spot it closed:
      # ShoutKitTVApp is a separate top-level target, absent from ShoutKit's
      # `dependencies` and from its Embed phase, so no other check compiles it.
      # It lives here rather than on every PR because `xcode-27` is a billed
      # larger runner and this job was restructured to cut that spend — a third
      # compile on the per-push path would give some of it straight back.
      #
      # `generic/platform=tvOS Simulator` keeps this a compile check with no
      # booted device, and CODE_SIGNING_ALLOWED=NO keeps it off the provisioning
      # path: the tvOS profile only exists because a real Apple TV was registered
      # locally, and CI has no device to register.
      - name: Build tvOS app (Debug)
        run: |
          set -o pipefail
          xcodebuild -workspace ShoutKit.xcworkspace -scheme ShoutKitTVApp \
            -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build-tv.log

      # actool reports a malformed layered app icon *and still exits zero*, so the
      # tvOS build goes green with an icon that fails later at install or App Store
      # validation. That happened on the first build of this target. Grepping the
      # log is the check that turns it back into a failure.
      - name: Fail on asset-catalog errors in the tvOS build
        run: |
          [ -f build-tv.log ] || exit 0
          if grep -qE "^.*(imagestack|brandassets|app icon|App Icon).*: error: " build-tv.log; then
            grep -E "^.*(imagestack|brandassets|app icon|App Icon).*: error: " build-tv.log \
              | sort -u | head -10 | sed 's/^/::error::/'
            echo "::error::tvOS asset catalog reported an error; actool exits 0 on these, so this step is the gate."
            exit 1
          fi

      - name: Emit tvOS compile errors as annotations
        if: failure()
        run: |
          [ -f build-tv.log ] || exit 0
          grep -E "[^ /]+\.(swift|h|m|mm):[0-9]+:[0-9]+: (error|fatal error): |^error: " build-tv.log \
            | sort -u | head -20 | sed 's/^/::error::/' || true

      # Every submitted bundle needs its own PrivacyInfo.xcprivacy: `UserDefaults`
      # is a required-reason API, and Apple's ITMS-91053 check inspects each bundle
      # in the upload rather than inheriting the host app's declaration. Until
      # 2026-08-13 only ShoutKit.app had one, so the watch app (embedded since
      # #166) and the tvOS app (its own submission) would both have been flagged.
      #
      # Inspects the built bundles rather than the repo, for the reason this file
      # keeps repeating: a resource that fails to register in project.pbxproj still
      # builds green. Nothing else here would notice its removal — no test, no
      # lint, and the failure otherwise waits for a real App Store upload.
      - name: Check watch and tvOS bundles carry a privacy manifest
        run: |
          # Named `failed` rather than `status`: `status` is read-only in zsh, so a
          # copy-paste of this loop into a local macOS shell would fail confusingly.
          failed=0
          for bundle in \
            "DerivedData/Build/Products/Debug-watchsimulator/ShoutKitWatchApp.app" \
            "DerivedData/Build/Products/Debug-appletvsimulator/ShoutKitTVApp.app"
          do
            name=$(basename "$bundle")
            if [ ! -d "$bundle" ]; then
              echo "::warning::$name was not built in this job; skipping its privacy-manifest check."
              continue
            fi
            if [ ! -f "$bundle/PrivacyInfo.xcprivacy" ]; then
              echo "::error::$name has no PrivacyInfo.xcprivacy. Each submitted bundle needs its own — the iOS app's does not cover it."
              failed=1
              continue
            fi
            reason=$(/usr/libexec/PlistBuddy \
              -c "Print :NSPrivacyAccessedAPITypes:0:NSPrivacyAccessedAPIType" \
              "$bundle/PrivacyInfo.xcprivacy" 2>/dev/null || true)
            if [ "$reason" != "NSPrivacyAccessedAPICategoryUserDefaults" ]; then
              echo "::error::$name's privacy manifest does not declare UserDefaults (got '${reason:-<none>}'). Both targets link Persistence, which reaches UserDefaults."
              failed=1
              continue
            fi
            echo "Confirmed: $name declares $reason."
          done
          exit $failed

      # The Debug-bundle counterpart to this — "is the watch app embedded in the
      # phone app" — lives in the `build` job, which is the one that produces a
      # Debug-iphonesimulator bundle to inspect.
      - name: Report Pulse symbol status in the Release build
        run: |
          APP_BINARY="DerivedData/Build/Products/Release-iphonesimulator/ShoutKit.app/ShoutKit"
          if [ ! -f "$APP_BINARY" ]; then
            echo "::error::Release app binary not found at $APP_BINARY"
            exit 1
          fi
          if nm "$APP_BINARY" 2>/dev/null | grep -q "NetworkLogger"; then
            echo "Pulse's compiled module is present (unused) in the Release binary — expected, see the comment above."
          else
            echo "Pulse symbols are absent from the Release binary."
          fi
