name: Release

# Tag-triggered: push a `vX.Y.Z` tag once CHANGELOG.md has a matching
# `## [X.Y.Z]` section (i.e. after moving entries out of `[Unreleased]`).
# This only drafts a GitHub Release from that section — it does not sign,
# archive, or upload to TestFlight, since that needs Apple signing secrets
# that aren't configured in this repo yet.
#
# A tag on a commit whose message contains `[skip ci]` does not trigger this
# workflow: GitHub reads the tagged commit's message on tag pushes too. Run it
# by hand with the tag name (workflow_dispatch) when that happens.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to draft a release for (e.g. v0.4.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  draft-release:
    name: Draft GitHub Release from CHANGELOG
    permissions:
      contents: write # create the draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Resolve version from tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$tag' is not a vX.Y.Z tag." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # Fails if the twelve MARKETING_VERSION entries disagree with each other;
      # only warns if they differ from the tag (deliberate for v0.4.0).
      - name: Compare tag with MARKETING_VERSION
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/check-marketing-version.sh "$VERSION"

      # Fail fast if a tag was pushed before the changelog was cut over from
      # [Unreleased] — better than a Release with an empty/wrong body.
      - name: Extract CHANGELOG section
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          version="$VERSION"
          # Version headers carry trailing text (e.g. "## [0.2.0] — 2026-06-25"),
          # so match on prefix rather than the full line.
          awk -v prefix="## [$version]" '
            index($0, prefix) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$version]' section. Cut the changelog over from [Unreleased] before tagging." >&2
            exit 1
          fi

          cat release-notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "Holmdel $VERSION" \
            --notes-file release-notes.md \
            --draft
