name: Release

# Tag-triggered: push a `vX.Y.Z` tag once CHANGELOG.md has a matching
# `## [X.Y.Z]` section (i.e. after moving entries out of `[Unreleased]`).
# This only drafts a GitHub Release from that section — it does not sign,
# archive, or upload to TestFlight, since that needs Apple signing secrets
# that aren't configured in this repo yet.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  draft-release:
    name: Draft GitHub Release from CHANGELOG
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Fail fast if a tag was pushed before the changelog was cut over from
      # [Unreleased] — better than a Release with an empty/wrong body.
      - name: Extract CHANGELOG section
        run: |
          version="${{ steps.version.outputs.version }}"
          # Version headers carry trailing text (e.g. "## [0.2.0] — 2026-06-25"),
          # so match on prefix rather than the full line.
          awk -v prefix="## [$version]" '
            index($0, prefix) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$version]' section. Cut the changelog over from [Unreleased] before tagging." >&2
            exit 1
          fi

          cat release-notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Holmdel ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            --draft
