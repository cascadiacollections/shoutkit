name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Scan dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Fails the PR on newly-introduced vulnerable dependencies or any license
      # outside the permissive allowlist below, matching the policy already
      # written down in THIRD_PARTY_LICENSES.md instead of relying on manual
      # review to catch it. An allowlist (rather than the deprecated
      # deny-licenses) inverts the check so GPL/LGPL/AGPL and any other
      # copyleft license is rejected by default; keep it in sync with the
      # licenses recorded in THIRD_PARTY_LICENSES.md.
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD
          comment-summary-in-pr: always
