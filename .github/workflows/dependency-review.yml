name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Scan dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Fails the PR on newly-introduced vulnerable or GPL/LGPL/AGPL-incompatible
      # dependencies, matching the policy already written down in
      # THIRD_PARTY_LICENSES.md instead of relying on manual review to catch it.
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0, GPL-3.0, LGPL-2.1, LGPL-3.0, AGPL-3.0
          comment-summary-in-pr: always
