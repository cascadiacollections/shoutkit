version: 2
updates:
  # Keep GitHub Actions versions current so runner/Node deprecations surface as
  # a PR instead of a silent warning in the log. (SwiftLint is pinned via an env
  # var in ci.yml and bumped by hand — Dependabot doesn't track raw download
  # URLs.)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies

  # Every package with a remote `.package(url:)` dependency needs a directory
  # here — the rest resolve exclusively through local `.package(path:)`
  # references (see THIRD_PARTY_LICENSES.md for the full inventory). One
  # multi-directory entry, not one entry per package, so `groups` can span
  # directories: Factory is `exact`-pinned in seven of these manifests, and an
  # ungrouped bump of just one would leave the graph with conflicting exact
  # pins — so all directories that reference it must live under this single
  # entry for the `factory` group below to cover them together.
  - package-ecosystem: swift
    directories:
      - "/Packages/RadioDirectory"
      - "/Packages/DesignSystem"
      - "/Packages/LiveActivity"
      - "/Packages/Playback"
      - "/Packages/Persistence"
      - "/Packages/DebugSupport"
      - "/Packages/FeatureFlags"
      - "/Packages/BrowseFeatureCore"
      - "/Packages/SearchFeatureCore"
      - "/Packages/Features/BrowseFeature"
      - "/Packages/Features/SearchFeature"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    labels:
      - dependencies
    groups:
      factory:
        patterns:
          - "*actory*"
