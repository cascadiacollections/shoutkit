version: 2
updates:
  # Keep GitHub Actions versions current so runner/Node deprecations surface as
  # a PR instead of a silent warning in the log. (SwiftLint is pinned via an env
  # var in ci.yml and bumped by hand — Dependabot doesn't track raw download
  # URLs.)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies

  # Only the packages with a remote `.package(url:)` dependency need an entry —
  # the rest resolve exclusively through local `.package(path:)` references
  # (see THIRD_PARTY_LICENSES.md for the three runtime deps this tracks).
  - package-ecosystem: swift
    directory: "/Packages/RadioDirectory"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    labels:
      - dependencies

  - package-ecosystem: swift
    directory: "/Packages/DesignSystem"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    labels:
      - dependencies

  - package-ecosystem: swift
    directory: "/Packages/LiveActivity"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    labels:
      - dependencies
