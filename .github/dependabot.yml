version: 2
updates:
  # Keep GitHub Actions versions current so runner/Node deprecations surface as
  # a PR instead of a silent warning in the log. (SwiftLint is pinned via an env
  # var in ci.yml and bumped by hand — Dependabot doesn't track raw download
  # URLs.)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies
    groups:
      github-actions:
        patterns: ["*"]
    cooldown:
      default-days: 7

  # The `swift` ecosystem is DISABLED again (2026-11-16, DECISIONS.md). The
  # updater image now has Swift 6.4.1 and parses these manifests, but its first
  # run crashed: it can't bump `Package.swift` `exact:` pins, and saving the
  # failed attempt force-adds SwiftPM's `.build/` and reports `unknown_error`.
  # Upstream: https://github.com/dependabot/dependabot-core/issues/16950
  #
  # Restore the block below once #16950 is fixed. Until then Factory
  # (`exact`, nine manifests), AudioStreaming and Pulse are hand-bumps.
