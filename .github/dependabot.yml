version: 2
updates:
  # Keep GitHub Actions versions current so runner/Node deprecations surface as
  # a PR instead of a silent warning in the log. (SwiftLint is pinned via an env
  # var in ci.yml and bumped by hand — Dependabot doesn't track raw download
  # URLs.)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies
    groups:
      github-actions:
        patterns: ["*"]
    cooldown:
      default-days: 7

  # Swift packages. Re-enabled 2026-11-16 (DECISIONS.md): dependabot-core's
  # swift/Dockerfile moved to Swift 6.4.1 on 2026-11-05 (#16817), which can
  # parse this tree's `swift-tools-version: 6.4` manifests. It was disabled
  # 2026-09-22 to 2026-11-16 while the updater image was on 6.3.1.
  #
  # Factory is `exact`-pinned in every manifest that uses it, so the `factory`
  # group keeps those bumps in one PR.
  - package-ecosystem: swift
    directories:
      - "/Packages/RadioDirectory"
      - "/Packages/DesignSystem"
      - "/Packages/Playback"
      # The only manifest that declares AudioStreaming, since #122 moved the
      # engine out of Playback. Missing from this list, its `exact: "1.4.5"`
      # pin would simply never be offered a bump.
      - "/Packages/PlaybackEngineAudioStreaming"
      - "/Packages/Persistence"
      - "/Packages/DebugSupport"
      - "/Packages/FeatureFlags"
      - "/Packages/BrowseFeatureCore"
      - "/Packages/SearchFeatureCore"
      - "/Packages/Features/BrowseFeature"
      - "/Packages/Features/SearchFeature"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    labels:
      - dependencies
    groups:
      factory:
        patterns:
          - "*actory*"
    # Same 7-day cooldown as github-actions. Security updates are not delayed.
    cooldown:
      default-days: 7
